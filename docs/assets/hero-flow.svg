  <text x="786" y="436" font-size="20" font-weight="700">GCP</text>
  <rect x="866" y="414" width="102" height="28" rx="7" fill="rgba(30,110,126,.08)"/>
  <text x="917" y="433" class="mono" font-size="13" fill="#1E6E7E" text-anchor="middle">Terraform</text>
