  <rect x="866" y="316" width="62" height="28" rx="7" fill="rgba(30,110,126,.08)"/>
  <text x="897" y="335" class="mono" font-size="13" fill="#1E6E7E" text-anchor="middle">Bicep</text>
  <text x="1128" y="324" font-size="14" fill="#44555C" text-anchor="end">PostgreSQL Flexible Server</text>
  <text x="1128" y="346" font-size="14" fill="#44555C" text-anchor="end">VNet delegada · senha do run</text>
</g>
