<!-- bugs -->
<text x="800" y="300" font-size="15" fill="#44555C">bugs que só a nuvem real mostra:</text>
<text x="800" y="326" font-size="14" class="sub">· service account sem role no GCP novo</text>
<text x="800" y="350" font-size="14" class="sub">· ordering do ARM · quota de free tier</text>
<text x="800" y="374" font-size="14" class="sub">· TLS do Redis · peering preso no destroy</text>

